<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet Me at Society — Café Society Valletta</title>
<meta name="description" content="Meet Me at Society — the Café Society Valletta message board.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="page board">
  <img class="board-sticker" src="assets/img/p-board-sticker.png" alt="">

  <div class="board-terminal">
    <span class="line">C:\&gt;stayhuman.exe_</span>
    <div class="board-actions">
      <button type="button" id="login-btn">User Login</button>
      <button type="button" id="post-btn">Post a Message</button>
    </div>
  </div>

  <div class="board-pixel-title">
    <span class="l1">MEET ME<br>AT</span>
    <span class="l2">Society</span>
  </div>

  <nav class="mini-nav" aria-label="Primary">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="events.html">Events</a>
    <a href="gallery.html">Gallery</a>
    <a href="lostsouls.html">Lost Souls Club</a>
    <a href="shop.html">Society Collection</a>
  </nav>

  <div class="board-inbox-header">
    <p class="bar">====================================</p>
    <p class="title">MESSAGE INBOX</p>
    <p class="bar">====================================</p>
  </div>

  <div class="board-messages" id="board-messages"></div>
</div>

<div class="modal-overlay" id="login-modal" aria-hidden="true">
  <div class="modal">
    <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
    <h3>&gt; User Login</h3>
    <form id="login-form" novalidate>
      <div class="field"><label for="login-username">Handle</label><input id="login-username" type="text" placeholder="e.g. jake_page" required></div>
      <button type="submit">Log In</button>
      <p class="form-msg"></p>
    </form>
  </div>
</div>

<div class="modal-overlay" id="post-modal" aria-hidden="true">
  <div class="modal">
    <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
    <h3>&gt; Post a Message</h3>
    <form id="post-form" novalidate>
      <div class="field"><label for="post-author">Author</label><input id="post-author" type="text" placeholder="your handle" required></div>
      <div class="field"><label for="post-subject">Subject</label><input id="post-subject" type="text" placeholder="what's happening?" required></div>
      <button type="submit">Post to Board</button>
      <p class="form-msg"></p>
    </form>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script src="assets/js/board.js"></script>
</body>
</html>
