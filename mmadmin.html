<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSOP CONSOLE — Meet Me at Society</title>
<meta name="robots" content="noindex, nofollow">
<!-- Private moderation page for the Meet Me at Society board (unlisted, served at /mmadmin).
     The key is the Netlify environment variable MEETME_ADMIN_KEY (set by Chef in Netlify, never in this repo);
     it is typed in here and kept only in this tab (sessionStorage). -->
<style>
  @font-face{ font-family:'VT323'; src:url('assets/fonts/vt323-latin-400-normal.woff2') format('woff2'); font-display:swap; }
  :root{ color-scheme:dark; }
  body{ margin:0; background:#06140a; color:#7dff7d; font:20px/1.25 'VT323', ui-monospace, monospace; text-shadow:0 0 .25em rgba(90,255,90,.6); }
  main{ max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1{ font:inherit; font-size:30px; letter-spacing:.3em; margin:0 0 4px; }
  h2{ font:inherit; font-size:22px; margin:28px 0 6px; border-bottom:1px dashed #3c8f3c; padding-bottom:4px; }
  p{ margin:4px 0; }
  .muted{ opacity:.65; }
  input{ font:inherit; color:inherit; background:#0c2412; border:1px solid #3c8f3c; padding:6px 8px; width:min(100%, 360px); }
  button{ font:inherit; color:#06140a; background:#7dff7d; border:0; padding:2px 10px; cursor:pointer; margin-right:6px; text-shadow:none; }
  button.no{ background:transparent; color:#ff8a8a; border:1px solid #ff8a8a; }
  ol{ list-style:none; margin:0; padding:0; }
  li{ display:grid; grid-template-columns:8.5em 1fr auto; gap:6px 14px; padding:8px 0; border-bottom:1px dotted #2b6b2b; align-items:baseline; }
  li .s{ grid-column:2; }
  @media (max-width:600px){ li{ grid-template-columns:1fr; } li .s{ grid-column:1; } }
</style>
</head>
<body>
<main>
  <h1>SYSOP CONSOLE</h1>
  <p class="muted">MEET ME AT SOCIETY BBS // MESSAGE APPROVAL QUEUE</p>
  <p class="muted">NEW MESSAGES STAY OFF THE BOARD UNTIL APPROVED HERE.</p>
  <form id="login"><p><label>ENTER SYSOP KEY&gt; <input id="key" type="password" autocomplete="current-password"></label> <button>[LOGIN]</button></p><p id="msg" class="muted"></p></form>
  <section id="lists" hidden>
    <h2>QUEUE: <span id="np">0</span> MESSAGE(S) AWAITING APPROVAL</h2><ol id="pending"></ol>
    <h2>BOARD: <span id="nl">0</span> MESSAGE(S) LIVE</h2><ol id="live"></ol>
    <p class="muted">AUTO-REFRESH EVERY 20 SEC. <button type="button" id="out" class="no">[LOGOFF]</button></p>
  </section>
</main>
<script>
(function(){
  const API = "/.netlify/functions/meetme", $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const when = at => at.replace("T", " ");
  let key = ""; try{ key = sessionStorage.getItem("mm-key") || ""; }catch(e){}
  const row = (p, btns) => `<li><span>${esc(when(p.at))}</span><span>&lt;${esc(p.author)}&gt;</span><span>${btns}</span><span class="s">${esc(p.subject)}</span></li>`;
  function show(d){
    $("login").hidden = true; $("lists").hidden = false;
    $("np").textContent = d.pending.length; $("nl").textContent = d.live.length;
    $("pending").innerHTML = d.pending.map(p => row(p, `<button data-a="approve" data-id="${esc(p.id)}">[APPROVE]</button><button class="no" data-a="reject" data-id="${esc(p.id)}">[REJECT]</button>`)).join("") || "<li class='muted'>QUEUE EMPTY.</li>";
    $("live").innerHTML = d.live.map(p => row(p, `<button class="no" data-a="delete" data-id="${esc(p.id)}">[DELETE]</button>`)).join("") || "<li class='muted'>NO MESSAGES.</li>";
  }
  function fail(r){ if(r.status === 401){ key = ""; try{ sessionStorage.removeItem("mm-key"); }catch(e){} $("login").hidden = false; $("lists").hidden = true; $("msg").textContent = "ACCESS DENIED. (SYSOP KEY WRONG, OR MEETME_ADMIN_KEY NOT SET IN NETLIFY.)"; } else $("msg").textContent = "NO CARRIER. TRY AGAIN."; }
  function load(){ if(!key) return;
    fetch(API + "?admin=1", { headers:{ "x-mm-key":key }, cache:"no-store" }).then(r => r.ok ? r.json().then(show) : fail(r)).catch(() => fail({}));
  }
  $("login").addEventListener("submit", e => { e.preventDefault(); key = $("key").value.trim(); try{ sessionStorage.setItem("mm-key", key); }catch(e){} load(); });
  document.addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if(!b) return;
    if(b.dataset.a !== "approve" && !b.dataset.sure){   // terminal-style confirm, no browser pop-up
      b.dataset.sure = "1"; b.textContent = b.dataset.a === "delete" ? "[REALLY DELETE? Y]" : "[REALLY REJECT? Y]";
      setTimeout(() => { if(b.isConnected){ delete b.dataset.sure; b.textContent = b.dataset.a === "delete" ? "[DELETE]" : "[REJECT]"; } }, 4000);
      return; }
    b.disabled = true;
    fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", "x-mm-key":key }, body:JSON.stringify({ action:b.dataset.a, id:b.dataset.id }) })
      .then(r => r.ok ? r.json().then(show) : fail(r)).catch(() => fail({}));
  });
  $("out").addEventListener("click", () => { key = ""; try{ sessionStorage.removeItem("mm-key"); }catch(e){} location.reload(); });
  load(); setInterval(() => { if(!document.hidden) load(); }, 20e3);
})();
</script>
</body>
</html>
