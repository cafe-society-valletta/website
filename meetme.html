<script>
  /* phones: scale the 402px-wide menu bar/footer to the screen width */
  (function(){ const set = () => document.documentElement.style.setProperty("--mmk", innerWidth / 402);
    set(); addEventListener("resize", set); })();
</script>
<script>
  /* monitor tube (phone: portrait monitor, desktop: the computer): load the clips only for the monitor that shows;
     the intro plays once, then the idle loop takes over. Reduced motion: just the idle still. */
  (function(){
    const box = document.querySelector(matchMedia("(max-width: 899.98px)").matches ? ".mm-phone" : ".mm-computer");
    const intro = box && box.querySelector(".mm-v-intro"), idle = box && box.querySelector(".mm-v-idle");
    const ready = () => { document.documentElement.classList.add("mm-ready"); document.dispatchEvent(new Event("mm:ready")); };
    if(!intro || !idle){ ready(); return; }
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){ intro.remove(); ready(); return; }
    const ext = intro.canPlayType('video/mp4; codecs="avc1.64001f"') ? ".mp4" : ".webm";   // H.264 where supported, else VP9
    const pick = v => v.dataset.src.replace(/\.mp4$/, ext);
    intro.src = pick(intro); idle.src = pick(idle); idle.preload = "auto";
    let done = false;
    const toIdle = pause => { if(done) return; done = true; idle.play().catch(() => {}); intro.pause(); intro.classList.add("done"); setTimeout(ready, pause || 0); };
    intro.addEventListener("ended", () => toIdle(900));   // a beat of empty screen before the inbox prints (Chef)
    const play = () => { if(!done) intro.play().catch(() => toIdle()); };   // autoplay blocked (e.g. low-power mode) → straight to the idle screen
    // meetme.js types the C:\> prompt live in the board font, wipes the screen, then the logo clip plays
    document.documentElement.classList.add("mm-boot");
    document.addEventListener("mm:booted", play, { once:true });
    setTimeout(play, 5000);   // safety net if the board script never loads
    addEventListener("keydown", e => { if(e.key.length === 1 || e.key === "Enter") toIdle(); });
    // click or tap on the monitor during the intro = skip straight to the inbox (Chef); that click does nothing else
    box.addEventListener("pointerdown", e => { if(done) return; toIdle();
      const eat = ev => { ev.preventDefault(); ev.stopPropagation(); }; box.addEventListener("click", eat, { capture:true, once:true });
      setTimeout(() => box.removeEventListener("click", eat, true), 600); }, true);   // also cancels the desktop boot prompt   // start typing = skip the intro
  })();
</script>
